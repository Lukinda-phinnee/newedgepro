version: 1
applications:
  - appRoot: trading-journal
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20 || nvm install 20
            - node -v
            - npm install --legacy-peer-deps
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
